<!DOCTYPE html>
<html>
<head>
    <title>Silly Dog Club</title>
</head>

<body>

    <h1>🐶 Silly Dog Club 🐶</h1>

    <p>Sign up to join the club!</p>

    <form>
        <label for="name">Your Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name">

        <br><br>

        <label for="dogname">Your Dog's Name:</label>
        <input type="text" id="dogname" name="dogname" placeholder="Enter your dog's name">

        <br><br>

        <p>What size is your dog?</p>

        <input type="radio" id="small" name="size" value="small">
        <label for="small">Small</label>

        <input type="radio" id="large" name="size" value="large">
        <label for="large">Big</label>

        <br><br>

        <label for="treat">Favorite Treat:</label>
        <select id="treat" name="treat">
            <option value="bacon">Bacon</option>
            <option value="cheese">Cheese</option>
            <option value="bones">Dog Bones</option>
        </select>

        <br><br>

        <input type="submit" value="JOIN THE CLUB!">

    </form>

</body>
</html>
