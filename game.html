<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mango Mystery Game</title>
</head>

<body>

  <header>
    <h1>Mystery Game: Mango Game</h1>
    <button type="button">Menu</button>
  </header>

  <main>

    <section>
      <h2>Location: Backyard</h2>

      <figure>
        <img src="paw-print.jpeg" alt="Paw print clue in the backyard">
        <figcaption>Paw Print Photo</figcaption>
      </figure>

      <p>
        location blurb
      </p>

      <p>
        Clue/description
      </p>

      <section>
        <h2>Choices</h2>

        <button type="button">Home mom/friend</button>
        <button type="button">Backyard prints/chicken</button>
        <button type="button">Park search/ask</button>
        <button type="button">Neighbor ask/gate</button>
        <button type="button">Chicken smell/photo</button>
        <button type="button">Hiding spot clue/Call mango</button>
      </section>

    </section>

    <aside>

      <section>
        <h2>Inventory</h2>
        <ul>
          <li>Paw Print Photo</li>
          <li>Chicken clue</li>
          <li>Phone help</li>
        </ul>
      </section>

      <section>
        <h2>Status</h2>
        <ul>
          <li>Clues: 0 to 3</li>
          <li>Mango Found? No</li>
          <li>Time Left: 15 mins</li>
        </ul>
      </section>

      <section>
        <h2>Unlock</h2>
        <p>Unlock 3 clues + help</p>
      </section>

    </aside>

  </main>

  <footer>
    <p>Location: Backyard</p>
    <progress value="2" max="6"></progress>
    <p>Next Location</p>
  </footer>

</body>
</html>
